<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>SELF Wellness — Thoughtfully Made For You</title>
    <meta name="description" content="SELF Wellness — Premium organic wellness essentials crafted for Strength, Energy, Lifestyle & Fulfillment. Vegan, cruelty-free, sustainable skincare and hair care." />
    <meta name="keywords" content="wellness, organic skincare, natural soap, vegan beauty, hair care, body scrub, face serum, luxury wellness, SELF wellness" />
    <meta name="author" content="SELF Wellness" />
    <meta name="theme-color" content="#ff7a00" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SELF Wellness" />
    <meta property="og:title" content="SELF Wellness — Thoughtfully Made For You" />
    <meta property="og:description" content="Premium organic wellness essentials crafted for Strength, Energy, Lifestyle & Fulfillment. Vegan, cruelty-free, sustainable." />
    <meta property="og:image" content="/images/self-logo.png" />
    <meta property="og:image:alt" content="SELF Wellness logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SELF Wellness — Thoughtfully Made For You" />
    <meta name="twitter:description" content="Premium organic wellness essentials. Vegan, cruelty-free, sustainable." />
    <meta name="twitter:image" content="/images/self-logo.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SELF Wellness",
      "url": "https://selfwellness.com",
      "logo": "/images/self-logo.png",
      "description": "Premium organic wellness essentials crafted for Strength, Energy, Lifestyle & Fulfillment.",
      "sameAs": [
        "https://instagram.com/selfwellness",
        "https://facebook.com/selfwellness"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SELF Wellness",
      "url": "https://selfwellness.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://selfwellness.com/#/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
